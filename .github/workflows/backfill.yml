name: Backfill ventas (histórico)
on:
  workflow_dispatch:
    inputs:
      anio:
        description: "Año desde el cual cargar el histórico de ventas"
        required: false
        default: "2025"
concurrency:
  group: backfill-ventas
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync/requirements.txt
      - run: pip install -r requirements.txt
      - name: Backfill de ventas
        run: python ventas.py --backfill ${{ inputs.anio }}
        env:
          TZ: America/Argentina/Buenos_Aires
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GBP_USER: ${{ secrets.GBP_USER }}
          GBP_PASSWORD: ${{ secrets.GBP_PASSWORD }}
