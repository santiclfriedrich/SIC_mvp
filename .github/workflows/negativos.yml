name: Recalcular negativos (Compras)
on:
  workflow_dispatch: {}
concurrency:
  group: negativos
  cancel-in-progress: false
jobs:
  negativos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync/requirements.txt
      - run: pip install -r requirements.txt
      - name: Recalcular negativos
        run: python compras.py
        env:
          TZ: America/Argentina/Buenos_Aires
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GBP_USER: ${{ secrets.GBP_USER }}
          GBP_PASSWORD: ${{ secrets.GBP_PASSWORD }}
          SGL_CLIENT_SECRET: ${{ secrets.SGL_CLIENT_SECRET }}
